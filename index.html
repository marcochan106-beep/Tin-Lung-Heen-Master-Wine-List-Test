<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#171411" />
  <title>Tin Lung Heen Master Wine List</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">Tin Lung Heen</div>
      <h1>Master Wine List</h1>
      <input id="q" class="search" type="search" placeholder="Search wine, region or vintage" aria-label="Search" />
      <nav id="nav" class="nav"></nav>
    </aside>
    <section class="shell">
      <header class="status">
        <b id="st"></b>
        <span id="meta" class="meta"></span>
      </header>
      <main id="main" class="main"></main>
    </section>
  </div>
  <script defer src="data/wines.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
